
name: Refactor and test Streamlit app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refactor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Generate refactored app
        run: python prepare_refactored_app.py

      - name: Check Python syntax
        run: python -m py_compile app_refactored.py

      - name: Run tests
        run: python -m pytest -q

      - name: Upload refactored app
        if: always() && hashFiles('app_refactored.py') != ''
        uses: actions/upload-artifact@v4
        with:
          name: refactored-streamlit-app
          path: app_refactored.py
          if-no-files-found: warn
          retention-days: 7
